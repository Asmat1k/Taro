name: GITHUB CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo (checkout)
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-node-env

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Clone repo (checkout)
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-node-env

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist
          retention-days: 3